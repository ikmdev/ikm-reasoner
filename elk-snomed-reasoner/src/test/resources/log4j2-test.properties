# Test logging for this module: everything to the console, which surefire writes to the
# test class's own file. elk-util-logging used to carry a configuration in its jar that also
# wrote logs/log.txt into the working directory; a library ships no logging configuration.
rootLogger = INFO, console
appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ABSOLUTE} [%-6p] %c - %m%n
